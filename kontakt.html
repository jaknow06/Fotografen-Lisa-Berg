<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisa Berg Bröllop och Porträtt</title>
    <link rel="stylesheet" href="css/kontakt.css">
</head>
<body>

    <header class="header">
        <h1>Lisa Berg Bröllop och Porträtt</h1>
    </header>

    <nav class="nav">
        <a href="index.html">Hem</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="kontakt.html">Kontakt</a>
        <a href="tjanster.html">Tjänster</a>
    </nav>

    <main class="contact">
        <h2>Kontakta mig</h2>

        <form action="#" method="post">
            <label for="namn">Namn:</label>
            <input type="text" id="namn" name="namn" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="kategori">Typ av fotografering:</label>
            <select id="kategori" name="kategori">
                <option value="portratt">Porträtt</option>
                <option value="brollop">Bröllop</option>
                <option value="foretag">Företag</option>
            </select>

            <label for="datum">Datum:</label>
            <input type="date" id="datum" name="datum">

            <label for="meddelande">Meddelande:</label>
            <textarea id="meddelande" name="meddelande"></textarea>

            <input type="submit" value="Skicka">
        </form>
    </main>
    <footer class="trademark">
        <p>&copy; 2024 Lisa Berg</p>
    </footer>
</body>
</html>
